spring:
  # H2 Database 설정
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:tcp://localhost/~/kis-new # H2 DB 연결 주소 (Embedded Mode)
    username: sa       # H2 DB 접속 ID (사용자 지정)
    password:     # H2 DB 접속 PW (사용자 지정)

  # H2 Console 설정
  h2:
    console: # H2 DB를 웹에서 관리할 수 있는 기능
      enabled: true           # H2 Console 사용 여부
      path: /h2-console       # H2 Console 접속 주소
  data:
    redis:
      host: http://localhost
      port: 80

  # JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create        # DB 초기화 전략 (none, create, create-drop, update, validate)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true      # 쿼리 로그 포맷 (정렬)
        show_sql: true        # 쿼리 로그 출력
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 12ae51c942add73cf5093021fdb1186a
            client-secret:  # 사용 안 해도 되는 경우도 있음
            client-authentication-method: POST
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  coolsms:
    senderNumber:
    apiKey:
    apiSecret:
jwt:
  secret: d8f49e0d5f1b42389a7c4bc8e25a9e3aa6f1ce3a524c47e4a9aef621ba3b9f4a
  secret_refresh: a4e07c3b8f694f8b9d7586245f4382c7cefe40cf36a44eb1918e2069b0c6d91f